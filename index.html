
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Store API Practice</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 20px;
        }

        .api {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #00000015;
            overflow-wrap: anywhere;
        }

        .card h1 {
            font-size: 20px;
        }

        .card h2 {
            font-size: 17px;
        }

        .card img {
            max-width: 200px;
            height: 200px;
            object-fit: contain;
        }

        .status {
            color: green;
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

    <h1>Fake Store API Products</h1>

    <div class="status"></div>

    <div class="api"></div>

    <script src="script.js"></script>

</body>

</html>
